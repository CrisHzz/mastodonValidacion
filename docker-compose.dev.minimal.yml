# Docker Compose MÍNIMO para desarrollo (sin Elasticsearch)
# Usa menos recursos - ideal para máquinas con RAM limitada
# Uso: docker-compose -f docker-compose.dev.minimal.yml up

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    shm_size: 128mb
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
      - POSTGRES_DB=mastodon_development
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.development
    command: bundle exec puma -C config/puma.rb
    networks:
      - external_network
      - internal_network
    healthcheck:
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/opt/mastodon
      - bundle_cache:/usr/local/bundle
      - node_modules:/opt/mastodon/node_modules
      - public_system:/opt/mastodon/public/system
    environment:
      - RAILS_ENV=development
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=postgres
      - DB_NAME=mastodon_development
      - DB_PASS=
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ES_ENABLED=false
      - LOCAL_DOMAIN=localhost:3000
      - LOCAL_HTTPS=false

  streaming:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    restart: unless-stopped
    env_file: .env.development
    command: node ./streaming/index.js
    networks:
      - external_network
      - internal_network
    healthcheck:
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./streaming:/opt/mastodon/streaming
      - node_modules:/opt/mastodon/node_modules
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=postgres
      - DB_NAME=mastodon_development
      - DB_PASS=
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.development
    command: bundle exec sidekiq
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - external_network
      - internal_network
    volumes:
      - .:/opt/mastodon
      - bundle_cache:/usr/local/bundle
      - public_system:/opt/mastodon/public/system
    environment:
      - RAILS_ENV=development
      - DB_HOST=db
      - DB_USER=postgres
      - DB_NAME=mastodon_development
      - DB_PASS=
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq' || false"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  external_network:
  internal_network:
    internal: true

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
  node_modules:
  public_system:
