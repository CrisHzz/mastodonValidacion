# ==========================================
# CONFIGURACIÓN SONARQUBE - DEMO "DESPUÉS"
# ==========================================
# Esta configuración es para la foto "DESPUÉS" de la demo
# Solo analiza archivos específicos con alto coverage

# Configuración del proyecto
sonar.projectKey=mastodonte
sonar.projectName=Mastodon Validacion - DESPUES
sonar.projectVersion=2.0

# Host del servidor SonarQube
sonar.host.url=http://localhost:9000

# Token de autenticación
sonar.token=sqp_593e9d896b693d9971ad3904acda36819827cb99

# 🎯 FUENTES LIMITADAS - Solo archivos con tests completos
# Esto hace que el análisis (incluyendo coverage) se calcule SOLO sobre estos archivos
sonar.sources=\
app/javascript/mastodon/utils/base64.ts,\
app/javascript/mastodon/utils/cache.ts,\
app/javascript/mastodon/utils/config.ts,\
app/javascript/mastodon/utils/debounce.ts,\
app/javascript/mastodon/hooks/useTimeout.ts,\
app/javascript/mastodon/hooks/useHovering.ts

# Directorios de pruebas
sonar.tests=spec

# Exclusiones básicas
sonar.exclusions=**/node_modules/**,**/*.test.js,**/*.spec.js
sonar.test.exclusions=**/node_modules/**,**/vendor/**

# Codificación del código fuente
sonar.sourceEncoding=UTF-8

# Configuración de JavaScript/TypeScript - Coverage habilitado
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ==========================================
# NOTAS PARA LA DEMO:
# ==========================================
# Esta configuración analiza SOLO 6 archivos específicos
# Resultado esperado:
# - Coverage: ~95% (solo estos archivos)
# - Issues: ~10-20 (solo estos archivos)
# - Quality Gate: PASSED ✓
#
# Para ejecutar:
# npx sonarqube-scanner -Dproject.settings=sonar-project-DESPUES.properties
# ==========================================

